# systemd drop-in for docker.service, installed by install.sh.
#
# Periphery, Homepage and the Beszel agent bind-mount /var/run/docker.sock.
# When dockerd restarts (e.g. an unattended apt upgrade), it recreates the
# socket, but live-restore keeps those containers running with the old,
# deleted one: Komodo shows every stack as down and Homepage loses container
# status. Restarting them picks up the new socket. The leading "-" ignores
# failure; xargs -r skips the restart when nothing mounts the socket.
[Service]
ExecStartPost=-/bin/sh -c 'docker ps -q --filter volume=/var/run/docker.sock | xargs -r docker restart'
