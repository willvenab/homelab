# systemd drop-in for docker.service, installed by install.sh.
#
# Periphery bind-mounts /var/run/docker.sock. When dockerd restarts (e.g. an
# unattended apt upgrade), it recreates the socket, but live-restore keeps
# Periphery running with the old, deleted one, so Komodo shows every stack as
# down. Restarting Periphery picks up the new socket. The leading "-" ignores
# failure, e.g. on a fresh install before the container exists.
[Service]
ExecStartPost=-/usr/bin/docker restart komodo-periphery-1
