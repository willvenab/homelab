# Hermes Agent (github.com/NousResearch/hermes-agent): a self-hosted AI agent
# with memory, skills and cron jobs. The hermes service is the gateway: it
# connects chat apps (Telegram, Discord, ...) and runs scheduled jobs. The
# agent's own web dashboard is left off in favour of the WebUI.
#
# Hermes WebUI (github.com/nesquena/hermes-webui) is the web UI, at
# hermes.<DOMAIN>. It runs the agent in its own process against the same
# /srv/appdata/hermes, so chats, memories and skills are shared with the
# gateway. It logs in through Authelia (OIDC, public client "hermes-webui").
#
# All state (config.yaml, .env with LLM and chat API keys, sessions, memories,
# skills) lives in /srv/appdata/hermes. API keys are set with `hermes setup`,
# not here: see README.md → "Hermes Agent".
#
# No Docker socket: the agent runs its tools inside its own container only.

services:
  hermes:
    image: nousresearch/hermes-agent:v0.21.6
    restart: unless-stopped
    # s6 keeps the container up and supervises the gateway; `gateway run`
    # itself just waits. The dashboard only starts if HERMES_DASHBOARD is set.
    command: ["gateway", "run"]
    # Upstream recommends 2-4 GB; the headless browser tool is the hungry part.
    mem_limit: 3g
    shm_size: 1g
    # Not on the proxy network: nothing connects to it.
    volumes:
      - /srv/appdata/hermes:/opt/data

  # Copies the agent's source out of its image for the WebUI, which installs
  # it on start. Keep this tag the same as the hermes service's (Renovate
  # bumps both). It only copies when the agent version changed, then stays up
  # (doing nothing) so Komodo doesn't count an exited container as unhealthy.
  # It must not re-copy while the WebUI runs: the WebUI reads /opt/hermes.
  agent-src:
    image: nousresearch/hermes-agent:v0.21.6
    restart: unless-stopped
    mem_limit: 256m
    # Lets `docker stop` end the sleep straight away.
    init: true
    entrypoint: ["sh", "-c"]
    # Skip the agent's own venv; the WebUI builds its own. The version stamp
    # is written last, so an interrupted copy is redone. The copy is made
    # readable to all on every start because some files in the image are
    # root-only (e.g. tools/.install.lock) and the WebUI runs as UID 10000.
    command:
      - >-
        rm -f /tmp/ready &&
        if ! cmp -s /etc/hermes/image-provenance.json /src/.image-provenance.json; then
        find /src -mindepth 1 -delete &&
        tar -C /opt/hermes --exclude=./.venv --exclude=./node_modules -cf - . |
        tar -C /src -xf - &&
        cp /etc/hermes/image-provenance.json /src/.image-provenance.json;
        fi &&
        chmod -R a+rX /src &&
        touch /tmp/ready &&
        exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1m
      start_interval: 2s
      start_period: 5m
    volumes:
      - agent-src:/src

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.52.458
    restart: unless-stopped
    depends_on:
      agent-src:
        condition: service_healthy
    # The agent and its tools run in here when you chat from the WebUI.
    mem_limit: 2g
    networks:
      - proxy
    labels:
      homepage.group: Apps
      homepage.name: Hermes
      homepage.icon: mdi-robot-outline
      homepage.href: https://hermes.${DOMAIN}
      homepage.description: AI agent with memory, skills and chat gateways
    volumes:
      # Same Hermes home as the agent, at the same path.
      - /srv/appdata/hermes:/opt/data
      - agent-src:/opt/hermes:ro
      # The file browser's workspace.
      - /srv/appdata/hermes-webui/workspace:/workspace
      # Makes the dependency install on each deploy quicker.
      - /srv/appdata/hermes-webui/uv-cache:/uv_cache
    environment:
      HERMES_HOME: /opt/data
      HERMES_WEBUI_STATE_DIR: /opt/data/webui
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      # Run as the agent image's hermes user, which owns /srv/appdata/hermes.
      # Auto-detection would pick the WebUI image's own user on first start.
      WANTED_UID: "10000"
      WANTED_GID: "10000"
      # Behind Caddy on https.
      HERMES_WEBUI_SECURE: "1"
      HERMES_WEBUI_ALLOWED_ORIGINS: https://hermes.${DOMAIN}
      # Login through Authelia, reached through Caddy's auth.<DOMAIN> alias on
      # the proxy network (stacks/caddy/compose.yaml). The redirect URI is
      # fixed because the WebUI would otherwise build it from the plain-http
      # request Caddy sends.
      # Only members of the Authelia group "admins" get in.
      HERMES_WEBUI_OIDC_ISSUER: https://auth.${DOMAIN}
      HERMES_WEBUI_OIDC_CLIENT_ID: hermes-webui
      HERMES_WEBUI_OIDC_REDIRECT_URI: https://hermes.${DOMAIN}/api/auth/oidc/callback
      HERMES_WEBUI_OIDC_SCOPES: openid profile email groups
      HERMES_WEBUI_OIDC_ALLOW_CLAIM: groups
      HERMES_WEBUI_OIDC_ALLOW_VALUES: admins

volumes:
  agent-src:

networks:
  proxy:
    external: true
