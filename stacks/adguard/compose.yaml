# DNS ad blocker for the LAN. Port 53 is published because clients query it
# directly; the web UI goes through Caddy like everything else.
# First deploy: open adguard.<DOMAIN> and run the setup wizard. Leave the
# "Admin Web Interface" port on 80 (Caddy proxies to it) and DNS on port 53.
# Then point your router's DHCP DNS at this box.

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - proxy
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - /srv/appdata/adguard/work:/opt/adguardhome/work
      - /srv/appdata/adguard/conf:/opt/adguardhome/conf

networks:
  proxy:
    external: true
