# One [[stack]] per directory in stacks/. Komodo clones this repo and runs
# `docker compose up` in run_directory. `environment` is written to .env there.
# git_account names the GitHub account added in the Komodo UI (Settings → Providers),
# which this private repo needs; its token never lands in git.
# Variables in [[double brackets]] are set in the Komodo UI (Settings → Variables),
# so secrets never land in git.
#
# To add a service: create stacks/<name>/compose.yaml, then copy a block below.

[[stack]]
name = "caddy"
description = "Reverse proxy and TLS for every web UI"
tags = ["homelab", "core"]
deploy = true
[stack.config]
server = "elitedesk"
repo = "willvenab/homelab"
git_account = "willvenab"
branch = "main"
run_directory = "stacks/caddy"
# Build the custom Caddy image (stacks/caddy/Dockerfile) before each deploy.
run_build = true
# Restart Caddy when the Caddyfile changes, so it reloads it. Otherwise the
# reconcile procedure only notices changes to compose.yaml.
config_files = [{ path = "conf/Caddyfile", requires = "Restart" }]
environment = """
DOMAIN = [[DOMAIN]]
CLOUDFLARE_API_TOKEN = [[CLOUDFLARE_API_TOKEN]]
"""

[[stack]]
name = "authelia"
description = "Single sign-on for every web UI"
tags = ["homelab", "core"]
deploy = true
after = ["caddy"]
[stack.config]
server = "elitedesk"
repo = "willvenab/homelab"
git_account = "willvenab"
branch = "main"
run_directory = "stacks/authelia"
# Restart Authelia when its config changes, so it reloads it.
config_files = [{ path = "config/configuration.yml", requires = "Restart" }]
environment = """
DOMAIN = [[DOMAIN]]
"""

