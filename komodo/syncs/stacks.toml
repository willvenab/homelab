# One [[stack]] per directory in stacks/. Komodo clones this repo and runs
# `docker compose up` in run_directory. `environment` is written to .env there.
# git_account names the GitHub account added in the Komodo UI (Settings → Providers),
# which this private repo needs; its token never lands in git.
# Variables in [[double brackets]] are set in the Komodo UI (Settings → Variables),
# so secrets never land in git.
#
# To add a service: create stacks/<name>/compose.yaml, then copy a block below.

[[stack]]
name = "caddy"
description = "Reverse proxy and TLS for every web UI"
tags = ["homelab", "core"]
deploy = true
[stack.config]
server = "elitedesk"
repo = "willvenab/homelab"
git_account = "willvenab"
branch = "main"
run_directory = "stacks/caddy"
# Build the custom Caddy image (stacks/caddy/Dockerfile) before each deploy.
run_build = true
# Redeploy when the Caddyfile changes. Otherwise the reconcile procedure
# only notices changes to compose.yaml.
config_files = [{ path = "Caddyfile", requires = "Redeploy" }]
environment = """
DOMAIN = [[DOMAIN]]
CLOUDFLARE_API_TOKEN = [[CLOUDFLARE_API_TOKEN]]
"""

[[stack]]
name = "beszel"
description = "Lightweight host and container monitoring"
tags = ["homelab", "monitoring"]
deploy = true
after = ["caddy"]
[stack.config]
server = "elitedesk"
repo = "willvenab/homelab"
git_account = "willvenab"
branch = "main"
run_directory = "stacks/beszel"
environment = """
BESZEL_AGENT_KEY = [[BESZEL_AGENT_KEY]]
"""

[[stack]]
name = "adguard"
description = "Network-wide DNS ad blocking"
tags = ["homelab", "dns"]
deploy = true
after = ["caddy"]
[stack.config]
server = "elitedesk"
repo = "willvenab/homelab"
git_account = "willvenab"
branch = "main"
run_directory = "stacks/adguard"
